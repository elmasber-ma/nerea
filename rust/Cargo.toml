[package]
name = "rust_lib_pr_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
candle-core = "0.8"
candle-nn = "0.8"
tokenizers = "0.20"
rand = "0.9"
# --- Gtool port (pinned igual que Gtool, probado en Android) ---
anyhow = "1"
sha2 = "0.10"
# Nerea: tokio mínimo (uso directo: rt, rt-multi-thread, sync, time).
# Las deps (iroh, rqbit, nostr) activan lo suyo por su cuenta.
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread", "sync", "time"] }
pkarr = "=8.0.0"
aes-gcm = "0.10"
pbkdf2 = "0.12"
# --- Tool-calling local (Needle v2, 45M params, modelo .cact 13.7 MB) ---
needle-infer = { version = "0.2.1", features = ["parallel"] }
# Nerea: sin Tor embebido (arti) ni GPU compute (wgpu) ni unarc.

nostr-sdk = { version = "=0.43.0", features = ["nip44", "nip59"] }
nostr = "=0.43.1"
shamirsecretsharing = "0.1"
rustls = { version = "0.23", features = ["ring"] }
nostringer = "0.1.8"
libcrux-kem = "0.0.7"
hf-hub = { version = "=1.0.0-rc.1", features = ["blocking"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "blocking"] }
# Nerea: sin GPU compute ni unarc.
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
mainline = { path = "mainline" }
# --- Iroh P2P (cliente+servidor de blobs, QUIC + relays n0) ---
iroh = "1"
iroh-blobs = "0.103"
iroh-tickets = "1"
# --- BitTorrent (rqbit embebido, TLS rustls para Android) ---
serde_json = "1"
# Nerea: sin unarc (RAR/7z/ZIP unificado).
# http-api-client: igual que los defaults del desktop; habilita el módulo
# http_api_types (PeerStatsFilter) sin arrastrar axum.
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api-client"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Nerea: dieta de tamaño (límite Play 200 MB con Gecko ~144 MB).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
